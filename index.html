<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="2026年度秋学期の履修科目・時間割・週ごとの授業内容・成績評価・教材をまとめたページ">
<title>2026年度 秋学期 履修ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141415'/%3E%3Crect x='14' y='16' width='36' height='32' rx='4' fill='none' stroke='%2360a5fa' stroke-width='3'/%3E%3Cpath d='M14 26h36M26 26v22M38 26v22' stroke='%2360a5fa' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body>

<div id="wallpaper" class="wallpaper" aria-hidden="true" hidden></div>
<div id="rain" class="rain-layer" aria-hidden="true" hidden></div>
<canvas id="ascii-background" class="ascii-background" aria-hidden="true" hidden></canvas>
<svg class="glass-filters" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs><filter id="glass-refraction" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage id="glass-map" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="lens"/>
    <feDisplacementMap in="SourceGraphic" in2="lens" scale="18" xChannelSelector="R" yChannelSelector="G"/>
  </filter></defs>
</svg>

<header class="masthead">
  <div class="masthead-in">
    <div class="brand">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="ttl">2026年度 秋学期 履修ダッシュボード</h1>
      <p id="sub"></p>
    </div>
    <div class="spacer"></div>
    <div class="header-tools">
  <div class="ambience" role="group" aria-label="背景">
    <button id="shuffle-btn" class="iconbtn" type="button"></button>
    <button id="rain-btn" class="iconbtn" type="button" aria-controls="rain ascii-background"></button>
    <span id="background-status" role="status"></span>
  </div>
      <button id="theme-btn" class="iconbtn" type="button"></button>
      <button id="text-color-btn" class="iconbtn" type="button"></button>
      <button id="settings-open" class="iconbtn" type="button"></button>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-home"   type="button" aria-selected="true"></button>
    <button role="tab" id="tab-week"   type="button" aria-selected="false"></button>
    <button role="tab" id="tab-course" type="button" aria-selected="false"></button>
    <button role="tab" id="tab-mats"   type="button" aria-selected="false"></button>
    <button role="tab" id="tab-settings" type="button" aria-selected="false"></button>
  </nav>

</header>

<main>
  <section class="view" id="view-home"></section>
  <section class="view" id="view-week" hidden></section>
  <section class="view" id="view-course" hidden></section>
  <section class="view" id="view-mats" hidden></section>
  <section class="view settings-view" id="view-settings" hidden>
    <div class="sec settings-heading"><p class="eyebrow">Preferences</p><h2 id="settings-title" tabindex="-1"></h2><p id="settings-intro"></p></div>
    <div class="sec">
      <div class="sec-head"><h2 id="background-effect-title"></h2></div>
      <div class="background-options">
        <select id="background-effect" aria-labelledby="background-effect-title">
          <option value="rain">雨</option><option value="ascii">ASCIIの動物</option><option value="off">エフェクトなし</option>
        </select>
        <label class="calendar-control" for="ascii-animal"><span id="ascii-animal-label"></span><select id="ascii-animal"></select></label>
      </div>
      <div class="ascii-tuning">
        <label for="ascii-size"><span id="ascii-size-label"></span><output id="ascii-size-value" aria-hidden="true"></output><input id="ascii-size" type="range" min="0.5" max="2.2" step="0.05" value="1"></label>
        <label for="ascii-density"><span id="ascii-density-label"></span><output id="ascii-density-value" aria-hidden="true"></output><input id="ascii-density" type="range" min="0.2" max="2.5" step="0.05" value="1"></label>
        <label for="ascii-speed"><span id="ascii-speed-label"></span><output id="ascii-speed-value" aria-hidden="true"></output><input id="ascii-speed" type="range" min="0.1" max="3" step="0.05" value="1"></label>
      </div>
    </div>
    <div class="sec"><div class="sec-head"><h2 id="glass-title"></h2><span id="glass-hint"></span></div><div id="glass-presets" class="preset-grid" role="group" aria-labelledby="glass-title"></div></div>
    <div class="settings-columns">
      <div class="sec"><div class="sec-head"><h2 id="appearance-title"></h2></div>
    <div class="switches">
      <div class="langswitch" role="group" aria-label="Language">
        <button id="btn-ja" type="button" aria-pressed="true">日本語</button>
        <button id="btn-en" type="button" aria-pressed="false">English</button>
      </div>
    </div>
      </div>
    </div>
  </section>
</main>

<footer class="foot"><p id="foot"></p><p id="photo-credit" class="photo-credit" hidden></p></footer>

<script src="glass-materials.js"></script>
<script src="app.js"></script>
<script src="effects.js"></script>
<script src="ascii-animals/engine.js" defer></script>
<script src="ascii-animals/background.js" defer></script>
<script src="glass-renderer.js"></script>
</body>
</html>
