<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雨の窓ガラス</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
#custom-bg{
  position:fixed;top:50%;left:50%;min-width:100%;min-height:100%;
  width:auto;height:auto;transform:translate(-50%,-50%) scale(1.05);
  z-index:0;object-fit:cover;filter:blur(4px) brightness(.45);will-change:filter;
}
#bg-canvas{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;
  opacity:.95;pointer-events:none;
}
</style>
</head>
<body>
<img id="custom-bg" crossorigin="anonymous" data-default-src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=1920&amp;q=80" alt="Misty forest background">
<canvas id="bg-canvas" aria-hidden="true" hidden></canvas>
<script>
/* The reference rain simulation runs inside this background document. */
const canvas=document.getElementById('bg-canvas');
const customBg=document.getElementById('custom-bg');
if(parent===window) customBg.src=customBg.dataset.defaultSrc;
function reportPhotoReady(){
  if(customBg.complete && customBg.naturalWidth){
    parent.postMessage({type:'rain-photo-ready',image:customBg.src},'*');
  }
}
customBg.addEventListener('load',reportPhotoReady);

/* Pause the document's frames without changing the renderer or its simulation. */
const nativeFrame=window.requestAnimationFrame.bind(window);
const cancelNativeFrame=window.cancelAnimationFrame.bind(window);
const pendingFrames=new Map();
let frameId=0,paused=parent!==window;
function scheduleFrame(id,entry){
  entry.native=nativeFrame(time=>{
    entry.native=0;
    if(paused) return;
    pendingFrames.delete(id);
    entry.callback(time);
  });
}
window.requestAnimationFrame=callback=>{
  const id=++frameId,entry={callback,native:0};
  pendingFrames.set(id,entry);
  if(!paused) scheduleFrame(id,entry);
  return id;
};
window.cancelAnimationFrame=id=>{
  const entry=pendingFrames.get(id);
  if(entry?.native) cancelNativeFrame(entry.native);
  pendingFrames.delete(id);
};
function pauseFrames(value){
  if(paused===value) return;
  paused=value;
  pendingFrames.forEach((entry,id)=>{
    if(paused){ cancelNativeFrame(entry.native); entry.native=0; }
    else scheduleFrame(id,entry);
  });
}

function initRaindrops(){
  // The currently supplied script boots itself; retain the example API for versions that export it.
  if(typeof Raindrops==='undefined') return;
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  try{
    new Raindrops(canvas,canvas.width,canvas.height,{
      fg:customBg,bg:customBg,rainChance:.4,brightness:1.1,renderDropsOnTop:true
    });
  }catch(error){ console.error('Rain effect failed:',error); }
}
/* Replace only the supplied renderer's unrelated street-photo textures (units
   2/3). Water, alpha, refraction, particles and animation remain in raindrops.js. */
function usePhotoTextures(gl){
  const upload=gl.texImage2D.bind(gl), sources=new Map();
  const draw=gl.drawArrays.bind(gl);
  gl.drawArrays=(...args)=>{
    draw(...args);
    if(customBg.complete && customBg.naturalWidth) canvas.hidden=false;
  };
  const getLocation=gl.getUniformLocation.bind(gl), uniform1f=gl.uniform1f.bind(gl), ratios=new Set();
  gl.getUniformLocation=(program,name)=>{
    const location=getLocation(program,name);
    if(location && name==='u_textureRatio') ratios.add(location);
    return location;
  };
  // Sources already contain the viewport's cover crop; avoid a second 3:2 crop.
  gl.uniform1f=(location,value)=>uniform1f(location,ratios.has(location)?canvas.width/canvas.height:value);
  function paint(source,background){
    if(!customBg.complete || !customBg.naturalWidth) return source.image;
    const image=source.image, ctx=image.getContext('2d');
    const scale=Math.max(canvas.width/customBg.naturalWidth,canvas.height/customBg.naturalHeight)*1.05;
    const width=canvas.width/scale, height=canvas.height/scale;
    ctx.clearRect(0,0,image.width,image.height);
    ctx.filter='brightness(.45)'+(background?' blur('+(4*image.width/window.innerWidth)+'px)':'');
    ctx.drawImage(customBg,(customBg.naturalWidth-width)/2,(customBg.naturalHeight-height)/2,width,height,0,0,image.width,image.height);
    return image;
  }
  gl.texImage2D=(...args)=>{
    const unit=gl.getParameter(gl.ACTIVE_TEXTURE);
    if(args.length===6 && (unit===gl.TEXTURE2 || unit===gl.TEXTURE3)){
      const image=document.createElement('canvas');
      image.width=args[5].width; image.height=args[5].height;
      const source={image,texture:gl.getParameter(gl.TEXTURE_BINDING_2D)};
      sources.set(unit,source);
      args[5]=paint(source,unit===gl.TEXTURE3);
    }
    upload(...args);
  };
  customBg.addEventListener('load',()=>{
    const active=gl.getParameter(gl.ACTIVE_TEXTURE);
    for(const [unit,source] of sources){
      gl.activeTexture(unit);
      const bound=gl.getParameter(gl.TEXTURE_BINDING_2D);
      gl.bindTexture(gl.TEXTURE_2D,source.texture);
      upload(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,paint(source,unit===gl.TEXTURE3));
      gl.bindTexture(gl.TEXTURE_2D,bound);
    }
    gl.activeTexture(active);
    // Refresh a paused view too, without advancing the simulation or its loops.
    if(sources.size && !canvas.hidden) gl.drawArrays(gl.TRIANGLES,0,6);
  });
}
function loadRainScript(){
  // Retain the last rendered image when the user pauses the external animation loops.
  // Match the renderer's boot size before creating its WebGL viewport.
  const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  canvas.width=Math.floor(window.innerWidth*dpr);
  canvas.height=Math.floor(window.innerHeight*dpr);
  const options={alpha:false,preserveDrawingBuffer:true};
  const gl=canvas.getContext('webgl',options) || canvas.getContext('experimental-webgl',options);
  if(!gl){
    parent.postMessage({type:'rain-error'},'*');
    return;
  }
  usePhotoTextures(gl);
  const script=document.createElement('script');
  script.src='https://fyildiz1974.github.io/web/files/raindrops.js';
  script.onload=()=>{
    if(customBg.complete) initRaindrops();
    else customBg.addEventListener('load',initRaindrops,{once:true});
  };
  script.onerror=()=>parent.postMessage({type:'rain-error'},'*');
  document.head.appendChild(script);
}
window.addEventListener('message',event=>{
  if(event.source!==parent || !event.data) return;
  const message=event.data;
  if(message.type==='rain-state'){
    pauseFrames(!message.running);
    if(typeof message.image==='string' && message.image!==customBg.src){
      const url=new URL(message.image);
      if(url.protocol==='https:' && url.hostname==='images.unsplash.com') customBg.src=url.href;
    }
    reportPhotoReady();
  }
  if(message.type==='rain-pointer' && !paused){
    document.dispatchEvent(new MouseEvent('mousemove',{clientX:message.x,clientY:message.y}));
  }
});
canvas.addEventListener('webglcontextlost',()=>parent.postMessage({type:'rain-error'},'*'));
customBg.addEventListener('error',()=>parent.postMessage({type:'rain-error'},'*'));
document.addEventListener('DOMContentLoaded',()=>{
  loadRainScript();
  parent.postMessage({type:'rain-ready'},'*');
});
</script>
</body>
</html>
