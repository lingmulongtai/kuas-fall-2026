name: Check dashboard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check effects.js && node --check glass-materials.js && node --check glass-renderer.js
      - run: node --test tests/*.test.cjs
      - run: node scripts/build.mjs
